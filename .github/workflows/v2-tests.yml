name: V2 Tests

on:
  push:
    branches:
      - v2-hardware-selector
      - main
  pull_request:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: node --check js/compatibility-engine.js && node --check js/selector.js

      - name: Run compatibility engine tests
        run: node tests/engine-tests.js
